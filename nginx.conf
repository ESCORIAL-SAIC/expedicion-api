# Reverse proxy TLS para la API de Expedicion. Ver docker-compose.proxy.yml.
#
# Este archivo se monta como conf.d/default.conf, asi que va dentro del bloque http de nginx:
# por eso limit_req_zone se declara aca arriba (a nivel http) y limit_req se usa adentro del
# server.

# Zona compartida para el rate limiting. 10m alcanza para ~160k IPs, de sobra para una red
# interna.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# HTTP -> HTTPS. La app manda las credenciales en cada request, asi que no debe quedar ninguna
# via en claro.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Los escaneos son requests chicos; no hace falta subir nada grande.
    client_max_body_size 64k;

    # Limite de peticiones por IP. La API no tiene rate limiting propio y revalida usuario y
    # password en CADA request, asi que sin esto el login queda expuesto a fuerza bruta.
    # 20 r/s con rafagas de 40 deja trabajar a un handheld escaneando rapido sin frenarlo.
    limit_req zone=api burst=40 nodelay;

    location / {
        proxy_pass http://expedicion-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un escaneo son varias consultas a dos bases; 30s cubre de sobra y corta si algo cuelga.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Para el monitoreo: no deberia quedar accesible desde afuera de la red interna.
    location /health/ {
        proxy_pass http://expedicion-api:3000/health/;
        access_log off;
    }
}
