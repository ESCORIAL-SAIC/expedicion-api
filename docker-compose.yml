name: expedicion-api

services:
  expedicion-api:
    container_name: expedicion-api
    image: ghcr.io/escorial-saic/expedicion-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Solo localhost: la API no tiene TLS y las credenciales viajan en cada request (no hay
      # sesion ni token), asi que no debe quedar expuesta directo a la red. El acceso va por el
      # reverse proxy. Para exponerla en la LAN sin proxy --entorno de prueba, red cerrada--
      # cambiar a '3000:3000', sabiendo que el trafico viaja en claro.
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Sin esto los logs crecen sin limite y terminan llenando el disco del server: cada request
    # deja una linea (pino) y la app corre todo el dia.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    # La API es liviana (Node + dos pools de conexion). El limite esta para que un pico no se
    # coma el server, no porque haga falta tanto.
    deploy:
      resources:
        limits:
          memory: 512M
