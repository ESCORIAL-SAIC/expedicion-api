services:
  api:
    image: ghcr.io/escorial-rs/expedicion-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
